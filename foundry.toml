[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = false
bytecode_hash = "ipfs"
remappings = [
  "erc721a/=lib/creator-token-standards/lib/ERC721A/",
  "@limitbreak/creator-token-standards/=lib/creator-token-standards/src/",
  "@chainlink/contracts/=lib/chainlink-brownie-contracts/contracts/",
  "@openzeppelin/contracts/=lib/creator-token-standards/lib/openzeppelin-contracts/contracts/",
]
